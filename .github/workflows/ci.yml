name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - backend
          - frontend

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci