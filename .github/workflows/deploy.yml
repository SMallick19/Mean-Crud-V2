name: Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 763103708432

  ECR_BACKEND: mean-crud-backend
  ECR_FRONTEND: mean-crud-frontend

  EKS_CLUSTER: mean-crud-cluster

  NAMESPACE: mean-crud

jobs:

  deploy:

    name: Build and Deploy

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: us-east-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Confirm ECR login
        run: echo "Logged in to ECR"
      - name: Generate image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Generated image tag: ${{ steps.image.outputs.tag }} ${GITHUB_SHA::7}"
      - name: Build backend
        run: |
          docker build \
            -t ${{ env.ECR_BACKEND }}:${{ steps.image.outputs.tag }} \
            ./backend
      - name: Build Frontend
        run: |
          docker build \
            -t ${{ env.ECR_FRONTEND }}:${{ steps.image.outputs.tag }} \
            ./frontend
      - name: Tag backend
        run: |
          docker tag \
            ${{ env.ECR_BACKEND }}:${{ steps.image.outputs.tag }} \
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_BACKEND }}:${{ steps.image.outputs.tag }}

      - name: Tag frontend
        run: |
          docker tag \
            ${{ env.ECR_FRONTEND }}:${{ steps.image.outputs.tag }} \
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_FRONTEND }}:${{ steps.image.outputs.tag }}
      - name: Push backend
        run: |
          docker push \
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_BACKEND }}:${{ steps.image.outputs.tag }}
      - name: Push frontend
        run: |
          docker push \
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_FRONTEND }}:${{ steps.image.outputs.tag }}
