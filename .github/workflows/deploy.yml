name: Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 763103708432

  ECR_BACKEND: mean-crud-backend
  ECR_FRONTEND: mean-crud-frontend

  EKS_CLUSTER: mean-crud-cluster

  NAMESPACE: mean-crud

jobs:

  deploy:

    name: Build and Deploy

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC sub:', payload.sub);
            console.log('OIDC aud:', payload.aud);
            console.log('Repository:', payload.repository);
            console.log('Repository owner:', payload.repository_owner);
            console.log('Ref:', payload.ref);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::763103708432:role/github-actions-mean-crud-v2-role
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Confirm ECR login
        run: echo "Logged in to ECR"