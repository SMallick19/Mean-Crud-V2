

@if(data !== ''){
  <h2 mat-dialog-title>User Edit</h2>
}@else{
  <h2 mat-dialog-title>User Add</h2>
}

<mat-dialog-content>
  <form [formGroup]="userForm">
    <div class="row">
        <div class="col-6">
          <p>Name</p>
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Name</mat-label>
            <input matInput type="text" formControlName="name"/>
          </mat-form-field>
      </div>
      <div class="col-6">
          <p>Email</p>
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput type="text" formControlName="email"/>
          </mat-form-field>
        </div>
      <div class="col-6">
        <p>Age</p>
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Age</mat-label>
          <input matInput type="text" formControlName="age"/>
        </mat-form-field>
      </div>
      <div class="col-6">
        <p>Address</p>
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Address</mat-label>
          <input matInput type="text" formControlName="address"/>
        </mat-form-field>
      </div>
  </div>
  </form>

</mat-dialog-content>
<mat-dialog-actions>
  <button mat-stroked-button mat-dialog-close>Cancel</button>

  @if(data !== ''){
    <button mat-stroked-button (click)="saveUser()">Update</button>
  }@else{
    <button mat-stroked-button (click)="saveUser()">Save</button>
  }

</mat-dialog-actions>
