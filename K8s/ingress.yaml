apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mean-crud-ingress
  namespace: mean-crud

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb

  rules:
    - http:

        paths:

          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend-service
                port:
                  number: 80