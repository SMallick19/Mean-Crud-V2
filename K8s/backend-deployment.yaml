apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: mean-crud
spec:
  replicas: 2
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 763103708432.dkr.ecr.us-east-1.amazonaws.com/mean-crud-backend:1.0
        ports:
        - containerPort: 3000
        env:
          - name: PORT
            value: "3000"

          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: MONGO_URI

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        